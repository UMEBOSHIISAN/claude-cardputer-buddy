<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The permission round trip and how the device decides what to show">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#101d40"/>
    </linearGradient>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fd3d3"/>
    </marker>
    <marker id="co" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a04b"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="url(#cbg)"/>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="70" cy="60" r="1.1"/><circle cx="1140" cy="70" r="1"/><circle cx="600" cy="26" r="1"/>
    <circle cx="40" cy="660" r="1"/><circle cx="1160" cy="640" r="1.1"/>
  </g>

  <text x="600" y="44" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e8eef7">You miss a dialog box. You do not miss a thing on your desk.</text>
  <text x="600" y="71" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8fa4c8">画面の中の承認ダイアログは見落とす。机の上で状態が変わる物体は見落とさない。</text>

  <line x1="600" y1="96" x2="600" y2="622" stroke="#2c4a86" stroke-opacity="0.6"/>

  <!-- LEFT: round trip -->
  <text x="46" y="126" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5fd3d3" letter-spacing="1">THE ROUND TRIP</text>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <!-- lifelines -->
    <rect x="46" y="146" width="150" height="40" rx="7" fill="#132449" stroke="#2c4a86"/>
    <text x="121" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#cdeaf2">Claude Code</text>
    <rect x="236" y="146" width="140" height="40" rx="7" fill="#132449" stroke="#2c4a86"/>
    <text x="306" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#cdeaf2">host daemon</text>
    <rect x="410" y="146" width="150" height="40" rx="7" fill="#1b2f5c" stroke="#5fd3d3"/>
    <text x="485" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#9de8e8">Cardputer</text>

    <line x1="121" y1="192" x2="121" y2="606" stroke="#2c4a86" stroke-dasharray="3 4"/>
    <line x1="306" y1="192" x2="306" y2="606" stroke="#2c4a86" stroke-dasharray="3 4"/>
    <line x1="485" y1="192" x2="485" y2="606" stroke="#5fd3d3" stroke-dasharray="3 4" stroke-opacity="0.6"/>

    <!-- step 1 -->
    <line x1="121" y1="222" x2="300" y2="222" stroke="#5fd3d3" stroke-width="2" marker-end="url(#ca)"/>
    <text x="128" y="215" font-size="11.5" fill="#8fa4c8">wants to run a tool</text>

    <!-- step 2 -->
    <line x1="306" y1="262" x2="479" y2="262" stroke="#5fd3d3" stroke-width="2" marker-end="url(#ca)"/>
    <text x="312" y="255" font-size="11.5" fill="#8fa4c8">BLE NUS · one JSON line</text>
    <rect x="236" y="272" width="330" height="42" rx="6" fill="#0d1c38" stroke="#2c4a86"/>
    <text x="248" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8fd8a0">{"running":1, "waiting":0, "tokens_today":8412,</text>
    <text x="248" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8fd8a0"> "prompt":{"id":"p1","tool":"Bash","hint":"rm -rf"}}</text>

    <!-- device reacts -->
    <rect x="404" y="330" width="162" height="62" rx="8" fill="#2c2213" stroke="#a8801f"/>
    <text x="485" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffe0a0">B_ATTENTION</text>
    <text x="485" y="370" text-anchor="middle" font-size="10.5" fill="#c9b183">outranks BUSY and IDLE</text>
    <text x="485" y="384" text-anchor="middle" font-size="10.5" fill="#c9b183">the screen changes on your desk</text>

    <!-- human -->
    <rect x="46" y="408" width="200" height="56" rx="8" fill="#132449" stroke="#4a90d9"/>
    <text x="146" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eef7">a human presses a key</text>
    <text x="146" y="450" text-anchor="middle" font-size="11" fill="#8fa4c8">o = allow once · d = deny</text>
    <line x1="252" y1="436" x2="470" y2="420" stroke="#f0a04b" stroke-width="2" marker-end="url(#co)"/>

    <!-- step 4 response -->
    <line x1="479" y1="486" x2="312" y2="486" stroke="#f0a04b" stroke-width="2" marker-end="url(#co)"/>
    <rect x="236" y="496" width="330" height="26" rx="6" fill="#0d1c38" stroke="#7d4a20"/>
    <text x="248" y="514" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#ffd9b0">{"cmd":"permission","id":"p1","decision":"once"}</text>

    <line x1="300" y1="546" x2="127" y2="546" stroke="#f0a04b" stroke-width="2" marker-end="url(#co)"/>
    <text x="140" y="539" font-size="11.5" fill="#c69a72">the tool runs — or does not</text>

    <rect x="404" y="566" width="162" height="44" rx="7" fill="#132449" stroke="#2c4a86" stroke-dasharray="4 3"/>
    <text x="485" y="585" text-anchor="middle" font-size="11" fill="#8fa4c8">perm_id cleared</text>
    <text x="485" y="600" text-anchor="middle" font-size="10.5" fill="#7f93b8">the same request cannot be</text>
  </g>
  <text x="485" y="614" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#7f93b8">answered twice</text>

  <!-- RIGHT: priority ladder -->
  <text x="646" y="126" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f0a04b" letter-spacing="1">WHAT THE FACE SHOWS, IN ORDER</text>
  <text x="646" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#6b7fa3">deriveBuddyState() — first match wins</text>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <g transform="translate(646,166)">
      <rect width="510" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="16" y="22" font-size="12" font-weight="700" fill="#8fa4c8">1</text>
      <text x="40" y="22" font-size="13.5" font-weight="600" fill="#e8eef7">not connected, or timed out after 30s</text>
      <text x="40" y="40" font-size="11.5" fill="#8fa4c8">→ SLEEP · demo scenarios cycle when no host is present</text>
    </g>
    <g transform="translate(646,228)">
      <rect width="510" height="66" rx="8" fill="#2c2213" stroke="#a8801f" stroke-width="2"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#ffe0a0">2</text>
      <text x="40" y="24" font-size="13.5" font-weight="700" fill="#ffe0a0">a permission prompt is pending</text>
      <text x="40" y="42" font-size="11.5" fill="#c9b183">→ ATTENTION · checked before running, before waiting, before</text>
      <text x="40" y="57" font-size="11.5" fill="#c9b183">   everything. This ordering is the whole reason the device exists.</text>
    </g>
    <g transform="translate(646,304)">
      <rect width="510" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="16" y="22" font-size="12" font-weight="700" fill="#8fa4c8">3</text>
      <text x="40" y="22" font-size="13.5" font-weight="600" fill="#e8eef7">sessions are running</text>
      <text x="40" y="40" font-size="11.5" fill="#8fa4c8">→ BUSY</text>
    </g>
    <g transform="translate(646,366)">
      <rect width="510" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="16" y="22" font-size="12" font-weight="700" fill="#8fa4c8">4</text>
      <text x="40" y="22" font-size="13.5" font-weight="600" fill="#e8eef7">sessions waiting, or tokens spent today</text>
      <text x="40" y="40" font-size="11.5" fill="#8fa4c8">→ IDLE</text>
    </g>
    <g transform="translate(646,428)">
      <rect width="510" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="16" y="22" font-size="12" font-weight="700" fill="#8fa4c8">5</text>
      <text x="40" y="22" font-size="13.5" font-weight="600" fill="#e8eef7">nothing happened at all</text>
      <text x="40" y="40" font-size="11.5" fill="#8fa4c8">→ SLEEP</text>
    </g>

    <rect x="646" y="500" width="510" height="110" rx="9" fill="#0f2233" stroke="#2f6a7d"/>
    <text x="668" y="528" font-size="13.5" font-weight="700" fill="#9de8e8">Two refusals worth knowing about</text>
    <text x="668" y="552" font-size="11.5" fill="#7fb0c0">Pressing <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#ffd9b0">o</tspan> or <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#ffd9b0">d</tspan> when no prompt is pending sends nothing at all.</text>
    <text x="668" y="571" font-size="11.5" fill="#7fb0c0">A stray keypress cannot approve a request that has not arrived.</text>
    <text x="668" y="594" font-size="11.5" fill="#7fb0c0">After a decision the pending id is cleared, so a second press is inert.</text>
  </g>

  <text x="600" y="666" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#6b7fa3">Nordic UART Service 6e400001 · newline-delimited JSON · 240×135 · no WiFi stack in this firmware</text>
</svg>
