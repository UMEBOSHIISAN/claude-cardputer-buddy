; Claude Cardputer Buddy — M5Cardputer port of anthropics/claude-desktop-buddy
; Board: M5Stack Cardputer (ESP32-S3 + 240x135 TFT + physical keyboard)

[env:m5cardputer]
platform          = espressif32
board             = m5stack-stamps3
framework         = arduino
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder

; LittleFS for character GIF assets
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv

; ESP32-S3 USB CDC (so Serial works over USB without UART chip)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    m5stack/M5Cardputer @ ^1.0.0
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.0.0
    bitbank2/AnimatedGIF @ ^2.1.1
